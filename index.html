<script>
/* ===== storage & helpers ===== */
/* ===== Storage: Google Sheet (Apps Script). Browser mein koi data save nahi hota ===== */
const GAS_URL='https://script.google.com/macros/s/AKfycbxj-mDrm5rx4LM06lk6iStpg2JeZd0GxKJYE0ZvGBFR6E0zsOkf_yIFcUT_qyoo4JNP/exec';
const DB={},VER={},BASE={},inflight={};   // DB = memory cache (JSON strings), VER = server version, BASE = last synced copy
let stale=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const St={
  g:k=>{const s=DB[k];if(s===undefined)return null;try{return JSON.parse(s)}catch(e){return null}},
  s:(k,v)=>{DB[k]=JSON.stringify(v===undefined?null:v);save(k)}
};
const Sess={g:()=>{try{return sessionStorage.getItem('noms_sid')}catch(e){return null}},s:v=>{try{v?sessionStorage.setItem('noms_sid',v):sessionStorage.removeItem('noms_sid')}catch(e){}}};
function setSync(t){const e=document.getElementById('syncb');if(e)e.textContent=t}
async function post(o){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json()}
async function getJSON(q){const r=await fetch(GAS_URL+'?'+q+'&t='+Date.now());return r.json()}
function save(k){setSync('⏳ Sheet mein save ho raha hai...');if(!inflight[k])flush(k)}
async function flush(k){
  inflight[k]=true;let fails=0;
  while(true){
    const sent=DB[k];let r;
    try{r=await post({action:'set',key:k,value:JSON.parse(sent),base:VER[k]||0})}
    catch(e){setSync('⚠️ Connection masla, dobara koshish...');await sleep(4000);continue}
    if(r.ok){VER[k]=r.ver;BASE[k]=sent;if(DB[k]!==sent)continue;break}
    if(r.conflict){DB[k]=merge(BASE[k],DB[k],r.value);VER[k]=r.ver;BASE[k]=r.value;stale=true;continue}
    if(++fails>5){toast('❌ Save nahi hua: '+(r.error||'server error'));break}
    await sleep(3000);
  }
  delete inflight[k];
  if(!Object.keys(inflight).length)setSync('☁️ Synced');
}
/* do users ek hi waqt save karein to records id ke hisab se merge hote hain */
function merge(bs,ls,rs){
  let b,l,r;try{b=bs?JSON.parse(bs):null;l=JSON.parse(ls);r=JSON.parse(rs)}catch(e){return ls}
  if(!Array.isArray(l)||!Array.isArray(r))return ls;
  b=Array.isArray(b)?b:[];
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!==undefined,js=JSON.stringify;
  if(l.concat(r).every(obj)){
    const M=a=>new Map(a.filter(obj).map(x=>[x.id,x])),bm=M(b),lm=M(l),used=new Set(),out=[];
    for(const x of r){used.add(x.id);
      if(lm.has(x.id)){const bx=bm.get(x.id),lx=lm.get(x.id);out.push(bx&&js(bx)===js(lx)?x:lx)}
      else if(!bm.has(x.id))out.push(x)}
    for(const x of l)if(!used.has(x.id)&&!bm.has(x.id))out.push(x);
    return js(out);
  }
  const seen=new Set(r.map(js));return js(r.concat(l.filter(x=>!seen.has(js(x)))));
}
async function loadAll(){
  const j=await getJSON('a=all');if(!j.ok)throw new Error(j.error||'load fail');
  for(const k in j.data){DB[k]=j.data[k];VER[k]=j.vers[k];BASE[k]=j.data[k]}
}
async function pull(){
  try{
    const j=await getJSON('a=vers');if(!j.ok)throw new Error(j.error);
    const need=Object.keys(j.vers).filter(k=>!inflight[k]&&VER[k]!==j.vers[k]);
    if(need.length){
      const d=await getJSON('a=get&keys='+encodeURIComponent(need.join(',')));if(!d.ok)throw new Error(d.error);
      for(const k of need){if(inflight[k]||d.data[k]===undefined)continue;if(DB[k]!==d.data[k])stale=true;DB[k]=d.data[k];VER[k]=d.vers[k];BASE[k]=d.data[k]}
    }
    if(!Object.keys(inflight).length)setSync('☁️ Synced');return true;
  }catch(e){setSync('📴 Connection nahi');return false}
}
function refreshIfIdle(){
  if(!stale||!me)return;
  const a=document.activeElement&&document.activeElement.tagName;
  if(mc.innerHTML||/INPUT|TEXTAREA|SELECT/.test(a||''))return;
  stale=false;const u=U(me.id);me=(u&&u.status==='active')?u:null;render();
}
async function syncNow(){toast('Sheet se data la rahe hain...');const ok=await pull();if(ok){stale=false;if(me){const u=U(me.id);me=(u&&u.status==='active')?u:null}render();toast('✅ Sync mukammal')}else toast('❌ Sheet se connect nahi hua')}
function startSync(){
  if(window._ss)return;window._ss=1;
  setInterval(async()=>{if(document.hidden)return;await pull();refreshIfIdle()},6000);
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){await pull();refreshIfIdle()}});
  window.addEventListener('focus',async()=>{await pull();refreshIfIdle()});
  window.addEventListener('beforeunload',e=>{if(Object.keys(inflight).length){e.preventDefault();e.returnValue=''}});
}
const L=k=>St.g(k)||[],W=(k,v)=>St.s(k,v);

function saveItem(id){
  const fd=new FormData(mf),v={};fd.forEach((x,k)=>v[k]=String(x).trim());v.as=fd.getAll('as');
  const j=v.cat==='Jadwal',lv=j&&v.jtype==='Leave',rm=v.cat==='Reminders';
  if(rm)v.as=[me.id];
  if(!v.as.length)return toast('Kam az kam ek emp assign karein');
  if(!v.date)return toast('Date zaroori hai');
  if(v.cat==='Tasks'){v.start='';v.end=''}
  if(lv){v.title='Leave';v.start='00:00';v.end='23:59';v.remD=v.remT=''}
  else{
    if(j&&!v.title)v.title=v.jtype;
    if(!v.title)return toast('Title zaroori hai');
    if(rm){if(!v.start)return toast('Reminder ka time zaroori hai');v.end='';v.remD=v.date;v.remT=v.start;v.prio='Medium'}
    else{if(!!v.remD!==!!v.remT)return toast('Reminder ke liye date aur time dono likhein');if(j&&v.jtype==='Half Day'&&(!v.start||!v.end))return toast('Half Day ke liye Start aur End time likhein')}
  }
  if(v.start&&v.end&&v.end<=v.start&&!lv)return toast('End time start ke baad hona chahiye');
  const E=check(v,id);if(E.length)return alert('⚠️ Schedule clash / masla:\n\n'+E.join('\n'));
  const all=items(),old=id?all.find(i=>i.id===id):null,need=!isBoss(me)&&!rm&&!j;
  v.appr=need?'pending':(old?old.appr||'ok':'ok');if(need)v.status='Pending';
  let nid=id;
  if(id)W('items',all.map(i=>i.id===id?{...i,...v}:i));
  else{nid=pk('ITM');all.push({id:nid,by:me.id,at:nowStr(),...v});W('items',all)}
  if(need)L('users').filter(u=>u.desig==='Nigran-e-Majlis'&&u.status==='active').forEach(n=>pushN(n.id,`Approval ke liye naya kaam: "${v.title}" (${v.cat}) — ${me.name} ne add kiya`,{item:nid}));
  else if(!id&&!rm)v.as.filter(a=>a!==me.id).forEach(a=>pushN(a,`Naya ${v.cat}: ${v.title} (${fd(v.date)} ${ft(v.start)}) — ${me.name} ki taraf se`,{item:nid}));
  if(lv){
    all.filter(o=>o.id!==nid&&o.date===v.date&&o.cat!=='Jadwal'&&o.cat!=='Reminders'&&!done(o)&&o.as.some(a=>v.as.includes(a))).forEach(o=>{
      W('items',items().map(x=>x.id===o.id?{...x,status:'Cancelled'}:x));
      new Set([o.by,...o.as]).forEach(a=>a!==me.id&&pushN(a,`❌ "${o.title}" (${o.cat}, ${fd(o.date)}) cancel ho gaya: ${v.as.map(uname).join(', ')} ki Leave add hui hai.`,{item:o.id}));
    });
  }
  closeM();toast(need?'Nigran-e-Majlis ki approval ke liye bhej diya':'Save ho gaya');render();
}

function range(){
  const d=D(pa);let s,e;
  if(pm==='day')s=e=d;else if(pm==='week'){s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));e=new Date(s);e.setDate(s.getDate()+6)}else{s=new Date(d.getFullYear(),d.getMonth(),1);e=new Date(d.getFullYear(),d.getMonth()+1,0)}
  const a=[];for(let x=new Date(s);x<=e;x.setDate(x.getDate()+1))a.push(iso(x));return a;
}
function shift(n){const d=D(pa);if(pm==='day')d.setDate(d.getDate()+n);else if(pm==='week')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);pa=iso(d);render()}
function busy(u,date){
  const its=items().filter(o=>o.as.includes(u.id)&&o.date===date&&!['Cancelled','Rejected'].includes(o.status)&&o.cat!=='Reminders'&&o.appr!=='rejected');
  if(its.some(o=>o.cat==='Jadwal'&&o.jtype==='Leave'))return null;
  const iv=its.filter(o=>o.start).map(o=>{const r=rng(o,u);return[mins(r[0]),mins(r[1])]}).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  let t=0,cur=-1;iv.forEach(([s,e])=>{if(s>cur){t+=e-s;cur=e}else if(e>cur){t+=e-cur;cur=e}});return t;
}
function planner(){
  const us=L('users').filter(u=>u.status==='active'),uu=(isBoss(me)&&pu&&us.find(u=>u.id===pu))||me,ds=range();
  const mine=items().filter(i=>i.as.includes(uu.id)&&i.appr!=='pending'),its=mine.filter(i=>ds.includes(i.date));
  const st=c=>{const a=its.filter(i=>i.cat===c),d=a.filter(i=>i.status==='Completed').length,x=a.filter(i=>i.status==='Cancelled').length;return[a.length,d,a.length-d-x]};
  const [mt,mdn,mrem]=st('Meeting'),[tt,tdn,trem]=st('Tasks');
  const od=mine.filter(i=>i.cat==='Tasks'&&overdue(i)).length,tf=ds.reduce((s,d)=>s+(busy(uu,d)||0),0);
  const card=(l,a,b,c)=>`<div class="${CARD} p-4"><div class="text-[11px] font-bold text-slate-600 dark:text-slate-300">${l}</div><div class="text-2xl font-extrabold mt-1">${a}</div><div class="text-[11px] text-slate-700 dark:text-slate-300">${b}</div></div>`;
  return `<div class="space-y-4"><div class="${CARD} p-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex gap-1">${['day','week','month'].map(m=>`<button onclick="pm='${m}';render()" class="${BTN2} ${pm===m?'!bg-indigo-600 !text-white':''}">${{day:'Daily',week:'Weekly',month:'Monthly'}[m]}</button>`).join('')}</div>
    <div class="flex items-center gap-2"><button class="${BTN2}" onclick="shift(-1)">←</button><b class="text-xs">${fd(ds[0])}${ds.length>1?' → '+fd(ds[ds.length-1]):''}</b><button class="${BTN2}" onclick="shift(1)">→</button><button class="${BTN2}" onclick="pa=today();render()">Today</button></div>
    ${isBoss(me)?`<select onchange="pu=this.value;render()" class="${INP} !w-auto">${us.map(u=>`<option value="${u.id}" ${u.id===uu.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}
    <button class="${BTN}" onclick="openForm(null,{cat:'Schedules'})">＋ Add Schedule</button></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${card('👥 Meetings',mt,`${mdn} complete · ${mrem} baki`)}${card('✅ Tasks',tt,`${tdn} complete · ${trem} baki`)}${card('🚨 Overdue tasks',od,'abhi tak pending')}${card('⏱️ Booked time',tf>=1439?'Full Day+':fmt(tf),'is period mein')}</div>
  <div class="${CARD} overflow-x-auto"><table class="w-full text-left text-xs"><thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 uppercase"><tr><th class="p-3.5">Date</th><th class="p-3.5">Kaam</th><th class="p-3.5">Booked time</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-700">${ds.map(d=>{const f=busy(uu,d),a=its.filter(i=>i.date===d&&i.cat!=='Reminders').sort((x,y)=>(x.start||'').localeCompare(y.start||''));return `<tr onclick="dayView('${d}')" class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/30 ${d===today()?'bg-indigo-50/60 dark:bg-indigo-950/30':''}"><td class="p-3.5 font-bold whitespace-nowrap">${D(d).toLocaleDateString('en',{weekday:'short'})} ${fd(d)}</td><td class="p-3.5">${a.map(i=>`<span class="inline-block mr-1 mb-1 px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-[11px] ${i.status==='Cancelled'?'line-through opacity-60':''}">${CAT[i.cat].i} ${ft(i.start)} ${esc(i.title)}</span>`).join('')||'<span class="text-slate-600 dark:text-slate-300">—</span>'}</td><td class="p-3.5 font-bold ${f===null?'text-red-500':'text-indigo-600 dark:text-indigo-300'}">${f===null?'Leave':f>=1439?'Full Day':f?fmt(f):'—'}</td></tr>`}).join('')}</tbody></table></div></div>`;
}

function dragStart(e,id){
  if(!e.target.closest('[data-drag]')||e.target.closest('button'))return;
  const el=e.currentTarget,r=el.getBoundingClientRect();dg={id,el,dx:e.clientX-r.left,dy:e.clientY-r.top};el.style.zIndex=++zc;e.preventDefault();
}
document.addEventListener('pointermove',e=>{
  if(!dg)return;const b=dg.el.parentElement,br=b.getBoundingClientRect();
  dg.el.style.left=Math.max(0,e.clientX-br.left+b.scrollLeft-dg.dx)+'px';dg.el.style.top=Math.max(0,e.clientY-br.top+b.scrollTop-dg.dy)+'px';
});

  W('snotes',L('snotes').map(n=>n.id===d.id?{...n,x:parseInt(d.el.style.left),y:parseInt(d.el.style.top),z:zc}:n));

  </div><div class="flex justify-end gap-2">${w==='rm1'?`<button onclick="closeM()" class="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-300">Cancel</button>`:''}<button class="${BTN} !text-sm" onclick="saveRem('${w}','${id||''}')">⏰ ${id?'Update':'Set'} Reminder</button></div></div>`;
}
function remType(w){const t=document.querySelector(`#${w} [name=rt]`).value;document.querySelectorAll(`#${w} [data-f]`).forEach(e=>e.classList.toggle('hidden',e.dataset.f!==t))}
function remSc(w){const g=document.querySelector(`#${w} [name=sc]`).value;document.querySelector(`#${w} [data-selbox]`).classList.toggle('hidden',g!=='Selected')}
function remModal(id){const r=id?items().find(i=>i.id===id):{date:today(),rtype:'Once'};modal(head(id?'Edit Reminder':'New Reminder')+remHTML(r,'rm1',id),'max-w-xl')}
function saveRem(w,id){
  const g=n=>document.querySelector(`#${w} [name=${n}]`),sc=g('sc').value,sel=[...document.querySelectorAll(`#${w} [name=rsel]:checked`)].map(x=>x.value);
  const m=g('rm').value.trim(),t=g('rtm').value,ty=g('rt').value,n=nowStr();let d=g('rd').value,wd,md;
  if(!m)return toast('Reminder message likhein');if(!t)return toast('Reminder time likhein');
  if(ty==='Once'&&!d)return toast('Reminder date likhein');
  if(sc==='Selected'&&!sel.length)return toast('Kam az kam ek emp select karein');
  if(ty!=='Once'){
    wd=+g('rwd').value;md=+g('rmd').value;const c=new Date();c.setHours(0,0,0,0);d='';
    for(let k=0;k<75&&!d;k++,c.setDate(c.getDate()+1)){
      const ds=iso(c),dim=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();
      if(ds+'T'+t<=n)continue;
      if(ty==='Daily'||(ty==='Weekly'&&c.getDay()===wd)||(ty==='Monthly'&&c.getDate()===Math.min(md,dim)))d=ds;
    }
    if(ty!=='Weekly')wd=undefined;if(ty!=='Monthly')md=undefined;
  }
  const v={cat:'Reminders',title:m.length>50?m.slice(0,50)+'…':m,details:'',remM:m,scope:sc,sel:sc==='Selected'?sel:[],rtype:ty,rwd:wd,rday:md,date:d,start:t,end:'',remD:d,remT:t,as:[me.id],prio:'Medium',appr:'ok'};
  const all=items();let nid=id;
  if(id)W('items',all.map(i=>i.id===id?{...i,...v}:i));else{nid=pk('ITM');all.push({id:nid,by:me.id,status:'Pending',at:nowStr(),...v});W('items',all)}
  (sc==='All'?L('users').filter(u=>u.status==='active').map(u=>u.id):sc==='Selected'?sel:[]).filter(x=>x!==me.id).forEach(x=>pushN(x,`⏰ ${me.name} ne aap ke liye reminder set kiya: ${m}`,{item:nid}));
  closeM();toast('Reminder set ho gaya');render();
}

  <div class="p-4 space-y-3">${rw('Category',c.i+' '+c.t)}${rw('Work',esc(i.title))}${rw('Status',tg(st))}${rw('Reminder Msg',esc(msg))}
  <button onclick="showWork('${i.id}');this.closest('.pop').remove()" class="w-full py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-md">👁️ Show Work</button></div>`;
  pops.appendChild(el);beep();
  if('Notification' in window&&Notification.permission==='granted'){
    try{const n=new Notification('⏰ Reminder — '+c.t,{body:`Category: ${c.t}\nWork: ${i.title}\nStatus: ${st}\nReminder Msg: ${msg}`,tag:i._k,requireInteraction:true});n.onclick=()=>{window.focus();showWork(i.id);n.close()}}catch(e){}
  }
}
function tick(){
  if(!me)return;const f=L('fired:'+me.id);let ch=false;
  dueNotes().forEach(i=>{
    if(f.includes(i._k))return;f.push(i._k);ch=true;
    if(Date.now()-new Date(i._o).getTime()<=864e5)showPop(i);
  });
  if(ch){W('fired:'+me.id,f.slice(-600));if(!dg&&!mc.firstChild&&!document.activeElement?.matches('input,select,textarea'))render()}
}

/* ===== Upload Peshgi Jadwal (Personal Assistant) ===== */
const fsz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.ceil(b/1024)+' KB';
function peshgi(){
  const a=L('peshgi').filter(x=>x.u===me.id).sort((x,y)=>y.at.localeCompare(x.at));
  return `<div class="space-y-4"><div class="${CARD} p-5 space-y-3"><h3 class="font-extrabold text-base">📤 Upload Peshgi Jadwal</h3><div class="grid sm:grid-cols-4 gap-3 items-end">
    <div class="space-y-1"><label class="text-sm font-bold">Title *</label><input id="pjt" class="${INP} !text-sm"></div>
    <div class="space-y-1"><label class="text-sm font-bold">Jadwal Date</label><input id="pjd" type="date" class="${INP} !text-sm"></div>
    <div class="space-y-1"><label class="text-sm font-bold">File * (PDF, Image, Word, Excel)</label><input id="pjf" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.csv" class="${INP} !text-sm"></div>
    <button class="${BTN} !text-sm" onclick="upPJ()">Upload</button></div><p class="text-xs font-semibold text-slate-700 dark:text-slate-300">Ek file ki hadd 5 MB hai. File Google Drive mein save hoti hai.</p></div>
  <div class="${CARD} overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-700 dark:text-slate-200 uppercase text-xs"><tr>${['Title','Jadwal Date','File','Size','Uploaded','Actions'].map(h=>`<th class="p-3.5">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-700">${a.map(x=>`<tr><td class="p-3.5 font-bold">${esc(x.title)}</td><td class="p-3.5">${fd(x.date)||'—'}</td><td class="p-3.5">${esc(x.name)}</td><td class="p-3.5">${fsz(x.size)}</td><td class="p-3.5">${fdt(x.at)}</td><td class="p-3.5 space-x-1"><button class="${BTN2}" onclick="dlPJ('${x.id}')">⬇ Download</button><button class="${BTN2} !text-red-600" onclick="delPJ('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center font-semibold text-slate-700 dark:text-slate-300">Abhi koi file upload nahi hui.</td></tr>'}</tbody></table></div></div>`;
}
function upPJ(){
  const f=pjf.files[0],t=pjt.value.trim();if(!t||!f)return toast('Title aur file zaroori hain');
  if(f.size>5242880)return toast('File 5 MB se choti honi chahiye');
  toast('File Google Drive par upload ho rahi hai...');
  const rd=new FileReader();
  rd.onload=async()=>{try{
    const r=await post({action:'upload',name:f.name,type:f.type,b64:String(rd.result).split(',')[1]});
    if(!r.ok)throw new Error(r.error||'upload fail');
    const a=L('peshgi');a.push({id:pk('PJD'),u:me.id,title:t,date:pjd.value,name:f.name,type:f.type,size:f.size,fid:r.fid,at:nowStr()});W('peshgi',a);toast('Upload ho gaya');render();
  }catch(e){toast('Upload fail: '+e.message)}};
  rd.readAsDataURL(f);
}
async function dlPJ(id){
  const x=L('peshgi').find(z=>z.id===id);if(!x)return;
  const save=(url)=>{const a=document.createElement('a');a.href=url;a.download=x.name;a.click()};
  if(x.data)return save(x.data);
  try{
    toast('File la rahe hain...');
    const j=await getJSON('a=file&id='+encodeURIComponent(x.fid));if(!j.ok)throw new Error(j.error||'file nahi mili');
    const bin=atob(j.b64),u8=new Uint8Array(bin.length);for(let n=0;n<bin.length;n++)u8[n]=bin.charCodeAt(n);
    const url=URL.createObjectURL(new Blob([u8],{type:j.type}));save(url);setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){toast('Download fail: '+e.message)}
}
function delPJ(id){
  if(!confirm('Yeh file delete karni hai?'))return;
  const x=L('peshgi').find(z=>z.id===id);
  W('peshgi',L('peshgi').filter(z=>z.id!==id));
  if(x&&x.fid)post({action:'trash',fid:x.fid}).catch(()=>{});
  render();
}

/* ===== Backup (Super Admin) ===== */
function mkZip(files){
  const te=new TextEncoder(),T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const n=new Date(),dt=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1),dd=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate();
  const parts=[],cen=[];let off=0,cs=0;
  files.forEach(f=>{
    const nm=te.encode(f.name),c=crc(f.data),h=new DataView(new ArrayBuffer(30)),g=new DataView(new ArrayBuffer(46)),L2=f.data.length;
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,c,true);h.setUint32(18,L2,true);h.setUint32(22,L2,true);h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,f.data);
    g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(12,dt,true);g.setUint16(14,dd,true);g.setUint32(16,c,true);g.setUint32(20,L2,true);g.setUint32(24,L2,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);
    cen.push(g.buffer,nm);off+=30+nm.length+L2;cs+=46+nm.length;
  });
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});
}
function backup(){
  const te=new TextEncoder(),files=[];
  for(const key in DB){files.push({name:'database/'+key.replace(/:/g,'_')+'.json',data:te.encode(DB[key])})}
  files.unshift({name:'README.txt',data:te.encode('NOMS backup\nCreated: '+fdt(nowStr())+'\nBy: '+me.name+'\nHar file ek table (collection) ka data JSON mein hai.\n')});
  const d=new Date(),url=URL.createObjectURL(mkZip(files)),a=document.createElement('a');
  a.href=url;a.download=`NOMS_Backup_${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}_${pad(d.getHours())}-${pad(d.getMinutes())}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup ZIP download ho gaya');
}

/* Purane browser data (localStorage) ko ek baar Sheet mein le jane ka shim. Migration ke baad is function ko delete kar sakte hain. */
async function legacyImport(){
  let old={};
  try{for(let i=0;i<localStorage.length;i++){const kk=localStorage.key(i);if(kk&&kk.startsWith('noms3:'))old[kk.slice(6)]=localStorage.getItem(kk)}}catch(e){return}
  const all=Object.keys(old);if(!all.length)return;
  const wipe=()=>{try{all.forEach(k=>localStorage.removeItem('noms3:'+k))}catch(e){}};
  const keys=all.filter(k=>!['session','dark','bn'].includes(k)&&!k.startsWith('fired:'));
  if(DB.users&&old.users&&DB.users===old.users){wipe();return}
  if(!keys.length){wipe();return}
  if(!confirm('Is browser mein purana NOMS data mila hai. Isay Google Sheet mein bhej dein? (OK = bhej do, Sheet ka data replace hoga. Cancel = abhi chor do)'))return;
  try{
    let n=0;
    for(const k of keys){
      toast('Data Sheet mein ja raha hai '+(++n)+'/'+keys.length+': '+k);
      let v=JSON.parse(old[k]);
      if(k==='peshgi'&&Array.isArray(v)){
        for(const x of v){if(x.data){const r=await post({action:'upload',name:x.name,type:x.type,b64:String(x.data).split(',')[1]});if(r.ok){x.fid=r.fid;delete x.data}}}
      }
      const r=await post({action:'set',key:k,value:v});if(!r.ok)throw new Error(r.error);
    }
    await loadAll();wipe();toast('✅ Purana data Sheet mein chala gaya');
  }catch(e){toast('❌ Import fail: '+e.message+' (purana data safe hai)')}
}
async function boot(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="min-h-screen flex items-center justify-center text-center p-8"><div class="space-y-4 animate-pulse"><p dir="rtl" lang="ar" style="font-family:\'Noto Naskh Arabic\',\'Traditional Arabic\',\'Scheherazade New\',\'Times New Roman\',serif;line-height:2" class="text-4xl sm:text-5xl font-bold text-emerald-700">صَلَّى اللّٰهُ عَلَيْهِ وَاٰلِهٖ وَسَلَّمَ</p><p class="font-extrabold text-lg text-slate-700">Durood Pak</p></div></div>';
  setSync('');
  try{await loadAll()}
  catch(e){
    setSync('📴 Connection nahi');
    app.innerHTML=`<div class="min-h-screen flex items-center justify-center text-center p-8"><div class="space-y-4 max-w-md"><div class="text-5xl">📴</div><p class="font-extrabold">Google Sheet se connect nahi ho saka</p><p class="text-xs font-semibold text-slate-600">Internet check karein, ya Apps Script ka URL/Deployment theek hai ya nahi. (${esc(e.message)})</p><button class="${BTN}" onclick="boot()">🔄 Dobara koshish karein</button></div></div>`;
    return;
  }
  await legacyImport();
  seed();me=U(Sess.g())||null;if(me&&me.status!=='active')me=null;render();tick();startSync();setSync('☁️ Synced');
}
window.onload=()=>{
  document.head.insertAdjacentHTML('beforeend',`<link rel="icon" href="${LOGO}">`);
  document.body.insertAdjacentHTML('beforeend','<div id="syncb" class="empty:hidden fixed bottom-2 left-2 z-[60] px-3 py-1 rounded-full bg-white/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 text-[10px] font-bold shadow pointer-events-none"></div>');
  boot();
};
